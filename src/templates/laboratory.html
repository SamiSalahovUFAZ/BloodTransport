<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laboratory dashboard | BloodTransport</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>
    <header>
        <nav class="shell" aria-label="Dashboards">
            <strong>BloodTransport</strong>
            <div class="dashboard-links">
                <a href="{{ url_for('index') }}">Dispatcher dashboard</a>
                <a href="{{ url_for('courier_dashboard') }}">Courier dashboard</a>
            </div>
        </nav>
    </header>
    <main class="shell">
        <h1>Laboratory dashboard</h1>
        <form id="destination-filter">
            <label for="destination">Laboratory location
                <input id="destination" placeholder="Delivery location entered by the dispatcher" required>
            </label>
            <button type="submit">Show incoming samples</button>
        </form>
        <section aria-labelledby="jobs-title">
            <h2 id="jobs-title">Incoming samples</h2>
            <p id="feedback" role="status">Enter your laboratory location to find samples.</p>
            <p id="error" role="alert" hidden></p>
            <div id="jobs"></div>
        </section>
    </main>

    <template id="receipt-template">
        <form class="receipt-form">
            <label>Received by
                <input name="actor" placeholder="Your name" required>
            </label>
            <button type="submit">Confirm receipt</button>
        </form>
    </template>

    <script>
        const form = document.querySelector("#destination-filter");
        const destination = document.querySelector("#destination");
        const jobs = document.querySelector("#jobs");
        const feedback = document.querySelector("#feedback");
        const error = document.querySelector("#error");
        const receiptTemplate = document.querySelector("#receipt-template");
        const endpoint = {{ url_for('list_transport_requests') | tojson }};
        const stages = new Map([
            ["delivered", { label: "Ready for receipt", priority: 0 }],
            ["picked_up", { label: "In transit", priority: 1 }],
            ["assigned", { label: "Awaiting pickup", priority: 2 }],
            ["pending", { label: "Awaiting courier assignment", priority: 3 }],
            ["received", { label: "Received", priority: 4 }],
        ]);

        function setBusy(busy) {
            document.querySelectorAll("form input, form button").forEach((field) => {
                field.disabled = busy;
            });
        }

        function showError(message) {
            error.textContent = message;
            error.hidden = false;
        }

        function createCard(job) {
            const card = document.createElement("article");
            const heading = document.createElement("h3");
            heading.textContent = "Sample " + job.sample_code;

            const route = document.createElement("p");
            route.textContent = job.origin + " → " + job.destination;

            const badge = document.createElement("span");
            badge.className = "status";
            badge.dataset.status = job.status === "delivered" ? "awaiting" : job.status;
            badge.textContent = stages.get(job.status).label;
            card.append(heading, route, badge);

            if (job.courier_name) {
                const courier = document.createElement("p");
                courier.textContent = "Courier: " + job.courier_name;
                card.append(courier);
            }

            if (job.status === "delivered") {
                const receiptForm = receiptTemplate.content.firstElementChild.cloneNode(true);
                const receiver = receiptForm.elements.namedItem("actor");
                receiver.addEventListener("input", () => receiver.setCustomValidity(""));
                receiptForm.addEventListener("submit", (event) => {
                    event.preventDefault();
                    const actor = receiver.value.trim();
                    if (!actor) {
                        receiver.setCustomValidity("Enter the recipient's name.");
                        receiver.reportValidity();
                        return;
                    }
                    confirmReceipt(job, actor);
                });
                card.append(receiptForm);
            }

            return card;
        }

        async function loadJobs(location) {
            const response = await fetch(endpoint, { cache: "no-store" });
            if (!response.ok) throw new Error("Could not load samples.");

            const data = await response.json();
            const normalizedLocation = location.toLowerCase();
            const matches = data.requests
                .filter((job) => job.destination.toLowerCase() === normalizedLocation && stages.has(job.status))
                .sort((a, b) => stages.get(a.status).priority - stages.get(b.status).priority);
            jobs.replaceChildren(...matches.map(createCard));
            feedback.textContent = matches.length
                ? matches.length + (matches.length === 1 ? " sample" : " samples") + " for " + location + "."
                : "No samples found for " + location + ".";
        }

        async function confirmReceipt(job, actor) {
            error.hidden = true;
            setBusy(true);
            try {
                const response = await fetch(endpoint + "/" + encodeURIComponent(job.id) + "/status", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status: "received", actor }),
                });
                if (response.status === 404 || response.status === 409) {
                    await loadJobs(destination.value);
                    showError("This sample's status changed. Check the refreshed list.");
                    return;
                }
                if (!response.ok) {
                    showError("Could not confirm receipt. Try again.");
                    return;
                }
                await loadJobs(destination.value);
                feedback.textContent += " Receipt confirmed for sample " + job.sample_code + ".";
            } catch {
                showError("Could not refresh the sample. Use Show incoming samples to check its current status.");
            } finally {
                setBusy(false);
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            destination.value = destination.value.trim();
            error.hidden = true;
            jobs.replaceChildren();
            if (!destination.value) {
                feedback.textContent = "Enter your laboratory location to find samples.";
                destination.focus();
                return;
            }

            feedback.textContent = "Loading samples…";
            setBusy(true);
            try {
                await loadJobs(destination.value);
            } catch {
                feedback.textContent = "";
                showError("Could not load samples. Try again.");
            } finally {
                setBusy(false);
            }
        });
    </script>
</body>
</html>
