<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Courier dashboard | BloodTransport</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f4f6fa; color: #202b3c; font: 1rem/1.5 system-ui, sans-serif; }
        .shell { width: min(64rem, calc(100% - 2rem)); margin-inline: auto; }
        header { background: #172842; color: #fff; border-bottom: 4px solid #dc6678; }
        header .shell { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .75rem; padding-block: 1rem; }
        header a { color: inherit; }
        main { padding-block: 2rem; }
        h1 { margin: 0 0 1rem; font-size: clamp(1.8rem, 4vw, 2.5rem); }
        h2 { margin: 0 0 .75rem; font-size: 1.25rem; }
        form, article { background: #fff; border: 1px solid #dce3ec; border-radius: .9rem; padding: 1.25rem; }
        form { display: flex; flex-wrap: wrap; align-items: end; gap: .75rem; margin-bottom: 1.5rem; }
        label { display: grid; gap: .3rem; flex: 1 1 12rem; max-width: 25rem; font-weight: 600; }
        input, button { min-height: 2.75rem; padding: .55rem .85rem; border-radius: .5rem; font: inherit; }
        input { min-width: 0; border: 1px solid #8795a8; }
        button { border: 0; background: #243e70; color: #fff; font-weight: 650; cursor: pointer; }
        button:disabled { opacity: .55; cursor: wait; }
        :focus-visible { outline: 3px solid #6758ae; outline-offset: 3px; }
        #jobs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 17rem), 1fr)); gap: .85rem; }
        article { overflow-wrap: anywhere; }
        article h3 { margin: 0 0 .4rem; }
        article p { margin: .55rem 0; }
        .status { display: inline-block; padding: .18rem .6rem; border-radius: 999px; background: #e8effb; color: #263f6c; font-weight: 650; }
        .status[data-status="picked_up"] { background: #f0e9fa; color: #523179; }
        .status[data-status="delivered"], .status[data-status="received"] { background: #e0f4e9; color: #205539; }
        #error { color: #99263c; }
    </style>
</head>
<body>
    <header>
        <nav class="shell" aria-label="Dashboards">
            <strong>BloodTransport</strong>
            <a href="{{ url_for('index') }}">Dispatcher dashboard</a>
        </nav>
    </header>
    <main class="shell">
        <h1>Courier dashboard</h1>
        <form id="courier-filter">
            <label for="courier-name">Courier name
                <input id="courier-name" placeholder="Name entered by the dispatcher" required>
            </label>
            <button type="submit">Show my assignments</button>
        </form>
        <section aria-labelledby="jobs-title">
            <h2 id="jobs-title">Transport assignments</h2>
            <p id="feedback" role="status">Enter your courier name to find assignments.</p>
            <p id="error" role="alert" hidden></p>
            <div id="jobs"></div>
        </section>
    </main>
    <script>
        const form = document.querySelector("#courier-filter");
        const input = document.querySelector("#courier-name");
        const filterButton = form.querySelector("button");
        const jobs = document.querySelector("#jobs");
        const feedback = document.querySelector("#feedback");
        const error = document.querySelector("#error");
        const endpoint = {{ url_for('list_transport_requests') | tojson }};
        const stages = {
            assigned: { label: "Courier assigned", next: "picked_up", action: "Mark as picked up" },
            picked_up: { label: "Picked up", next: "delivered", action: "Mark as delivered" },
            delivered: { label: "Delivered" },
            received: { label: "Received" },
        };

        function setBusy(value) {
            input.disabled = value;
            filterButton.disabled = value;
            jobs.querySelectorAll("button").forEach((button) => { button.disabled = value; });
        }

        function showError(message) {
            error.textContent = message;
            error.hidden = false;
        }

        function createCard(job) {
            const card = document.createElement("article");
            const title = document.createElement("h3");
            title.textContent = "Sample " + job.sample_code;

            const route = document.createElement("p");
            route.textContent = job.origin + " → " + job.destination;

            const stage = stages[job.status];
            const status = document.createElement("span");
            status.className = "status";
            status.dataset.status = job.status;
            status.textContent = stage.label;
            card.append(title, route, status);

            if (stage.next) {
                const controls = document.createElement("p");
                const button = document.createElement("button");
                button.type = "button";
                button.textContent = stage.action;
                button.addEventListener("click", () => updateStatus(job, stage.next));
                controls.append(button);
                card.append(controls);
            }
            return card;
        }

        async function loadJobs(name) {
            const response = await fetch(endpoint, { cache: "no-store" });
            if (!response.ok) throw new Error("Could not load assignments.");

            const data = await response.json();
            const normalizedName = name.toLowerCase();
            const matches = data.requests.filter((job) =>
                job.courier_name?.toLowerCase() === normalizedName
                && Object.hasOwn(stages, job.status)
            );
            jobs.replaceChildren(...matches.map(createCard));
            feedback.textContent = matches.length
                ? matches.length + (matches.length === 1 ? " assignment" : " assignments") + " for " + name + "."
                : "No assignments found for " + name + ".";
        }

        async function updateStatus(job, status) {
            error.hidden = true;
            setBusy(true);
            try {
                const response = await fetch(endpoint + "/" + encodeURIComponent(job.id) + "/status", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status, actor: job.courier_name }),
                });
                if (response.status === 404 || response.status === 409) {
                    await loadJobs(input.value);
                    showError("This assignment changed. Check the refreshed list.");
                    return;
                }
                if (!response.ok) {
                    showError("Could not update the assignment.");
                    return;
                }
                await loadJobs(input.value);
                feedback.textContent += " Sample " + job.sample_code + " marked " + stages[status].label.toLowerCase() + ".";
            } catch {
                showError("Could not refresh the assignment. Use Show my assignments to check its current status.");
            } finally {
                setBusy(false);
            }
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            input.value = input.value.trim();
            error.hidden = true;
            jobs.replaceChildren();
            if (!input.value) {
                feedback.textContent = "Enter your courier name to find assignments.";
                input.focus();
                return;
            }

            feedback.textContent = "Loading assignments…";
            setBusy(true);
            try {
                await loadJobs(input.value);
            } catch {
                feedback.textContent = "";
                showError("Could not load assignments. Try again.");
            } finally {
                setBusy(false);
            }
        });
    </script>
</body>
</html>
